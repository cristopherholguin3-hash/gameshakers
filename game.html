<!DOCTYPE html>
<html>
<head>
  <title>Blackjack</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="game.html">Play Game</a>
  <a href="community.html">Community</a>
  <a href="about.html">About</a>
</nav>

<!-- Background music -->
<audio id="bg-music" src="assets/bg/21_theme_capstone.mp3" type="audio/mpeg" loop>
</audio>

<div class="table">

  <h2>Dealer</h2>
  <div id="dealer-cards" class="cards"></div>

  <h2>Player</h2>
  <div id="player-cards" class="cards"></div>

  <div class="controls">
    <button onclick="hit()">Hit</button>
    <button onclick="stand()">Stand</button>
    <button onclick="startGame()">Restart (Single)</button>
    <button onclick="startMultiplayer()">Multiplayer</button>
  </div>

  <h3 id="result"></h3>

</div>

<!-- CHATBOX -->
<div class="chatbot">
  <div class="chat-header">🤖 Code & Strategy Assistant</div>

  <div class="chat-body" id="chat-body">
    <div><b>Bot:</b> Hi! Ask me about rules, strategy, or type <code>/set</code> to change settings.</div>
  </div>

  <div class="chat-input">
    <input id="chat-input" type="text" placeholder="Type a question or command...">
    <button onclick="sendChat()">Send</button>
  </div>
</div>

<!-- Your game logic -->
<script src="game.js"></script>

<!-- ⭐ REQUIRED FIX: Allow audio after first user click -->
<script>
document.addEventListener("click", () => {
  const m = document.getElementById("bg-music");
  if (m && m.paused) {
    m.volume = 0.4;
    m.play().catch(()=>{});
  }
}, { once: true });
</script>

</body>
</html>
